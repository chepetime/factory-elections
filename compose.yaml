name: factory-data
services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_DB: factory
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm data:up first}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-15432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U factory -d factory']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  files:
    image: chrislusf/seaweedfs:4.54
    command: ['mini', '-dir=/data', '-ip.bind=0.0.0.0', '-s3.port=8333']
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Run pnpm data:up first}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Run pnpm data:up first}
      S3_BUCKET: factory-artifacts
    ports:
      - '127.0.0.1:${S3_PORT:-18333}:8333'
    volumes:
      - artifact-data:/data
    restart: unless-stopped
volumes:
  postgres-data:
  artifact-data:
