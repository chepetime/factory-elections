syntax = "proto3";
package factory.v1;

// Canonical record snapshots remain validated by @factory/core's Zod schemas.
// The envelope avoids a second, lossy copy of the task-file schema in protobuf.
message Empty {}
message Target { string project = 1; string id = 2; }
message Snapshot { string json = 1; }
message Text { string text = 1; }
message Submission { string project = 1; string prompt = 2; string jira_key = 3; }
message ProjectRegistration { string name = 1; string repo = 2; }
message PullRequestQuery { string project = 1; bool drafts = 2; bool approved = 3; }
message ReviewTarget { string project = 1; uint32 number = 2; }
message ReviewStart { string project = 1; repeated uint32 numbers = 2; string mode = 3; }
message ReviewMessage { string project = 1; uint32 number = 2; string text = 3; }
message SettingsUpdate { string project = 1; string json = 2; }
message Command {
  string project = 1;
  string id = 2;
  string action = 3;
  string note = 4;
  string head = 5;
  bool accept_blocking = 6;
  bool draft = 7;
  uint32 max_attempts = 8;
  // follow-up only: the agent that does it, `custom` or `conflicts`, `you` or `factory`, and the
  // PR head when the conflict watcher added it.
  string agent = 9;
  string kind = 10;
  string by = 11;
  string pr_head = 12;
}
message Assignment {
  string project = 1;
  string email = 2;
  string team = 3;
  repeated string tags = 4;
}
service Factory {
  // Generated from packages/backend-client/src/rpcs.ts by `pnpm rpc:generate`; edit the list there.
  rpc GetDiagnostics(Empty) returns (Snapshot);
  rpc GetTeam(Target) returns (Snapshot);
  rpc ListTeamRecords(Target) returns (Snapshot);
  rpc SaveTeamRecord(SettingsUpdate) returns (Snapshot);
  rpc GetGitUser(Target) returns (Text);
  rpc UpdateMembers(SettingsUpdate) returns (Snapshot);
  rpc SaveAssignment(Assignment) returns (Text);
  rpc ListProjects(Empty) returns (Snapshot);
  rpc AddProject(ProjectRegistration) returns (Snapshot);
  rpc ListPullRequests(PullRequestQuery) returns (Snapshot);
  rpc StartReviews(ReviewStart) returns (Snapshot);
  rpc GetReview(ReviewTarget) returns (Snapshot);
  rpc SendReviewMessage(ReviewMessage) returns (Text);
  rpc StopReview(ReviewTarget) returns (Text);
  rpc RemoveReview(ReviewTarget) returns (Text);
  rpc GetUserSettings(Empty) returns (Snapshot);
  rpc SaveUserSettings(Snapshot) returns (Snapshot);
  rpc GetUserEnvironment(Empty) returns (Snapshot);
  rpc GetProjectSettings(Target) returns (Snapshot);
  rpc SaveProjectSettings(SettingsUpdate) returns (Snapshot);
  rpc DetectProjectSettings(Target) returns (Snapshot);
  rpc GetMemory(Target) returns (Snapshot);
  rpc ForgetFact(Target) returns (Text);
  rpc RestoreTools(Target) returns (Text);
  rpc ListFeatures(Target) returns (Snapshot);
  rpc GetFeature(Target) returns (Snapshot);
  rpc CreateFeature(SettingsUpdate) returns (Snapshot);
  rpc FeatureAction(SettingsUpdate) returns (Snapshot);
  rpc ListIssues(Target) returns (Snapshot);
  rpc GetIssue(SettingsUpdate) returns (Snapshot);
  rpc CreateIssue(SettingsUpdate) returns (Snapshot);
  rpc UpdateIssue(SettingsUpdate) returns (Snapshot);
  rpc MoveIssue(SettingsUpdate) returns (Snapshot);
  rpc CommentIssue(SettingsUpdate) returns (Snapshot);
  rpc FollowUpIssue(SettingsUpdate) returns (Snapshot);
  rpc ArchiveIssue(SettingsUpdate) returns (Snapshot);
  rpc DeleteIssue(SettingsUpdate) returns (Snapshot);
  rpc GetProfileStatus(Target) returns (Snapshot);
  rpc DraftProfile(Target) returns (Snapshot);
  rpc ApproveProfile(Target) returns (Snapshot);
  rpc ListAgents(Empty) returns (Snapshot);
  rpc GetAgent(Snapshot) returns (Snapshot);
  rpc CreateAgent(Snapshot) returns (Snapshot);
  rpc UpdateAgent(Snapshot) returns (Snapshot);
  rpc ArchiveAgent(Snapshot) returns (Snapshot);
  rpc GetAgentStats(Snapshot) returns (Snapshot);
  rpc GetRunSession(Target) returns (Snapshot);
  rpc ListChats(Snapshot) returns (Snapshot);
  rpc GetChat(Snapshot) returns (Snapshot);
  rpc StartChat(Snapshot) returns (Snapshot);
  rpc SendChatMessage(Snapshot) returns (Snapshot);
  rpc StopChat(Snapshot) returns (Snapshot);
  rpc RenameChat(Snapshot) returns (Snapshot);
  rpc DeleteChat(Snapshot) returns (Snapshot);
  rpc GetTrace(SettingsUpdate) returns (Snapshot);
  rpc GetMetrics(SettingsUpdate) returns (Snapshot);
  rpc ListSpans(SettingsUpdate) returns (Snapshot);
  rpc CreateReviewTicket(SettingsUpdate) returns (Snapshot);
  rpc DecideReview(SettingsUpdate) returns (Snapshot);
  rpc GetReviewLoop(Target) returns (Snapshot);
  rpc RestartReviewLoop(Target) returns (Snapshot);
  rpc ListFindings(Target) returns (Snapshot);
  rpc GetSystemCatalog(Target) returns (Snapshot);
  rpc ListPrReviewRecords(Target) returns (Snapshot);
  rpc AddPrReviewRecord(SettingsUpdate) returns (Snapshot);
  rpc ListOutcomes(Target) returns (Snapshot);
  rpc AddOutcome(SettingsUpdate) returns (Snapshot);
  rpc ListExperiments(Target) returns (Snapshot);
  rpc AddExperiment(SettingsUpdate) returns (Snapshot);
  rpc GetInbox(Empty) returns (Snapshot);
  rpc DismissInboxItem(SettingsUpdate) returns (Text);
  rpc TendPullRequests(Target) returns (Snapshot);
  rpc ListTickets(Target) returns (Snapshot);
  rpc ListTasks(Target) returns (Snapshot);
  rpc GetTask(Target) returns (Snapshot);
  rpc GetTaskControls(Target) returns (Snapshot);
  rpc GetGate(Target) returns (Snapshot);
  rpc GetDiff(Target) returns (Text);
  rpc SubmitTask(Submission) returns (Text);
  rpc ExecuteTask(Command) returns (Text);
  rpc StartRun(Command) returns (Snapshot);
  rpc GetBackground(Target) returns (Snapshot);
  rpc ClearLog(Target) returns (Text);
  rpc StopRun(Target) returns (Text);
  rpc ConfirmCleanup(Target) returns (Text);
  rpc StartProfileCheck(Target) returns (Snapshot);
  rpc GetProfileCheck(Target) returns (Snapshot);
}
