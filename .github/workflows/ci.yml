name: CI
on:
  pull_request:
  # PRs merge without being up to date with main, so main itself runs the checks after each merge:
  # a combination of PRs that breaks main shows up here within minutes.
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Select affected workspaces
        id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha || '--all' }}
        run: node scripts/ci-plan.mjs "$BASE" HEAD
      - uses: pnpm/action-setup@v4
        if: steps.plan.outputs.code == 'true'
      - uses: actions/setup-node@v4
        if: steps.plan.outputs.code == 'true'
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        if: steps.plan.outputs.code == 'true'
      - name: Validate affected code
        if: steps.plan.outputs.code == 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha || '--all' }}
        run: node scripts/ci-run.mjs "$BASE" HEAD
      - name: Documentation-only result
        if: steps.plan.outputs.code == 'false'
        run: echo 'No application inputs changed; tests skipped.'
