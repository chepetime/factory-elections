openapi: 3.1.0
info:
  title: Factory project read API
  version: 1.0.0
paths:
  /api/projects:
    get:
      operationId: listProjects
      responses:
        '200':
          description: Registered projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './project.schema.json'
        '503':
          description: Project source is unavailable
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    const: project_source_unavailable
                additionalProperties: false
